<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>灵感库 · Idea Board</title>
<style>
  :root{
    --primary:#6C63FF;
    --primary-2:#8B7BFF;
    --secondary:#3ECFCF;
    --accent:#FF6584;
    --bg:#F7F8FD;
    --surface:#FFFFFF;
    --surface-2:#F4F5FC;
    --ink:#1A1A2E;
    --ink-2:#5A5A7A;
    --line:#E8E9F5;
    --shadow:0 6px 28px rgba(108,99,255,.10), 0 1px 3px rgba(20,20,50,.05);
    --shadow-hover:0 16px 48px rgba(108,99,255,.18), 0 2px 6px rgba(20,20,50,.06);
    --r:20px;
    --r-sm:13px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--font);color:var(--ink);background:var(--bg);min-height:100vh;position:relative;overflow-x:hidden}
  .bg-deco{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(680px 460px at 8% -10%, rgba(108,99,255,.16), transparent 60%),
      radial-gradient(600px 420px at 102% 4%, rgba(62,207,207,.14), transparent 55%),
      radial-gradient(720px 520px at 85% 115%, rgba(255,101,132,.07), transparent 60%);}
  .wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:46px 22px 80px}

  .hero{text-align:center;margin-bottom:30px}
  .hero .kicker{font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--primary)}
  .hero h1{font-size:clamp(32px,5vw,48px);font-weight:800;letter-spacing:-.02em;margin-top:8px}
  .hero p{color:var(--ink-2);margin-top:10px;font-size:15px}
  .stats{display:flex;gap:14px;justify-content:center;margin-top:18px;flex-wrap:wrap}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);
    padding:10px 18px;box-shadow:var(--shadow);text-align:center;min-width:110px}
  .stat b{display:block;font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--secondary));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .stat span{font-size:12px;color:var(--ink-2)}

  .controls{display:flex;gap:12px;flex-wrap:wrap;margin:26px 0 24px;align-items:center}
  .search{flex:1;min-width:220px;display:flex;align-items:center;gap:10px;background:var(--surface);
    border:1.5px solid var(--line);border-radius:999px;padding:0 18px;height:50px;box-shadow:var(--shadow);
    transition:border-color .2s ease}
  .search:focus-within{border-color:var(--primary)}
  .search svg{flex:none;opacity:.5}
  .search input{flex:1;border:none;outline:none;background:transparent;font-size:15px;color:var(--ink);font-family:var(--font)}
  .sort{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);
    border-radius:999px;height:50px;padding:0 16px;box-shadow:var(--shadow)}
  .sort label{font-size:13px;color:var(--ink-2);font-weight:600}
  .sort select{border:none;outline:none;background:transparent;font-size:14px;font-weight:700;color:var(--ink);font-family:var(--font);cursor:pointer}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;
    box-shadow:var(--shadow);text-decoration:none;color:inherit;display:flex;flex-direction:column;
    transition:transform .22s cubic-bezier(.2,0,0,1),box-shadow .22s ease;cursor:pointer;
    opacity:0;transform:translateY(14px);animation:rise .55s cubic-bezier(.2,0,0,1) forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  .card:hover{transform:translateY(-5px);box-shadow:var(--shadow-hover)}
  .card:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
  .c-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .c-title{font-size:18px;font-weight:800;letter-spacing:-.01em;line-height:1.3}
  .c-score{flex:none;font-size:13px;font-weight:800;color:#fff;padding:5px 11px;border-radius:999px;
    background:linear-gradient(135deg,var(--primary),var(--primary-2));white-space:nowrap}
  .c-sum{margin-top:10px;color:var(--ink-2);font-size:14px;line-height:1.6;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .c-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .c-tag{font-size:11.5px;font-weight:600;color:var(--primary);background:rgba(108,99,255,.10);
    border:1px solid rgba(108,99,255,.16);padding:3px 9px;border-radius:999px}
  .c-foot{margin-top:14px;padding-top:13px;border-top:1px solid var(--line);display:flex;justify-content:space-between;
    align-items:center;color:var(--ink-2);font-size:12.5px}
  .c-foot .go{font-weight:700;color:var(--primary)}
  .empty{text-align:center;color:var(--ink-2);padding:60px 20px;font-size:15px;display:none}
  .foot{margin-top:40px;text-align:center;color:var(--ink-2);font-size:12.5px;opacity:.7}
</style>
</head>
<body>
<div class="bg-deco"></div>
<main class="wrap">
  <header class="hero">
    <div class="kicker">Idea Board</div>
    <h1>灵感库</h1>
    <p>抛想法进来，先体检、后动手。每个灵感都有八维评分与可行性分析。</p>
    <div class="stats">
      <div class="stat"><b id="stat-count">0</b><span>灵感总数</span></div>
      <div class="stat"><b id="stat-avg">0.0</b><span>平均评分</span></div>
      <div class="stat"><b id="stat-top">—</b><span>最高评分</span></div>
    </div>
  </header>

  <div class="controls">
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="搜索标题、标签或摘要…" autocomplete="off">
    </label>
    <div class="sort">
      <label for="sort">排序</label>
      <select id="sort">
        <option value="new">最新优先</option>
        <option value="score-desc">评分高→低</option>
        <option value="score-asc">评分低→高</option>
        <option value="title">标题 A→Z</option>
      </select>
    </div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">没有匹配的灵感，换个关键词试试。</div>

  <div class="foot">由 xin-ideas skill 维护 · 数据存于本文件 IDEAS 数组，新增灵感时追加一项即可</div>
</main>

<script>
/* ============================================================
   灵感索引数据 —— 新增灵感时，往这个数组里 push 一项即可。
   file 为相对本文件的路径（.xin-ideas/ 子目录下）。score 为综合评分(1-10)。
   ============================================================ */
const IDEAS = [
  {
    id: "example",
    title: "示例灵感",
    ts: "2026-01-01 00:00",
    tags: ["示例","模板"],
    score: 7.0,
    summary: "这是一条示例卡片，新增灵感后它会被真实的想法取代。点击可跳转到详情页。",
    file: ".xin-ideas/idea_example.html"
  }
];

const grid=document.getElementById('grid');
const empty=document.getElementById('empty');
const q=document.getElementById('q');
const sort=document.getElementById('sort');

function cardColor(v){
  if(v>=8) return "linear-gradient(135deg,#3ECFCF,#6C63FF)";
  if(v>=6) return "linear-gradient(135deg,#8B7BFF,#6C63FF)";
  if(v>=4) return "linear-gradient(135deg,#FFB36B,#FFA94D)";
  return "linear-gradient(135deg,#FF8DA3,#FF6584)";
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function render(){
  const kw=q.value.trim().toLowerCase();
  let list=IDEAS.filter(it=>{
    if(!kw) return true;
    return (it.title+it.summary+it.tags.join(' ')).toLowerCase().includes(kw);
  });
  const s=sort.value;
  list.sort((a,b)=>{
    if(s==='new') return b.ts.localeCompare(a.ts);
    if(s==='score-desc') return b.score-a.score;
    if(s==='score-asc') return a.score-b.score;
    return a.title.localeCompare(b.title,'zh');
  });

  grid.innerHTML=list.map((it,i)=>`
    <a class="card" href="${it.file}" style="animation-delay:${i*0.05}s">
      <div class="c-top">
        <div class="c-title">${esc(it.title)}</div>
        <div class="c-score" style="background:${cardColor(it.score)}">${it.score.toFixed(1)}</div>
      </div>
      <div class="c-sum">${esc(it.summary)}</div>
      <div class="c-tags">${it.tags.map(t=>`<span class="c-tag">${esc(t)}</span>`).join('')}</div>
      <div class="c-foot"><span>🕒 ${esc(it.ts)}</span><span class="go">查看详情 →</span></div>
    </a>`).join('');

  empty.style.display=list.length?'none':'block';
}

// 统计
document.getElementById('stat-count').textContent=IDEAS.length;
const avg=IDEAS.reduce((s,i)=>s+i.score,0)/(IDEAS.length||1);
document.getElementById('stat-avg').textContent=avg.toFixed(1);
document.getElementById('stat-top').textContent=IDEAS.length?Math.max(...IDEAS.map(i=>i.score)).toFixed(1):'—';

q.addEventListener('input',render);
sort.addEventListener('change',render);
render();
</script>
</body>
</html>
