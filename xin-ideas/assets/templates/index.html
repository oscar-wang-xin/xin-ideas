<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>灵感库 · Idea Board</title>
<script>
/* 主题初始化：默认浅色；读取本地偏好，避免闪烁 */
try{
  if(localStorage.getItem('xin-ideas-theme')==='dark'){
    document.documentElement.setAttribute('data-theme','dark');
  }
}catch(e){}
</script>
<style>
  :root{
    --primary:#6C63FF; --primary-2:#8B7BFF; --secondary:#3ECFCF; --accent:#FF6584;
    --bg:#F6F7FC; --surface:#FFFFFF; --surface-2:#EFF1FA; --surface-3:#E6E8F6;
    --ink:#17182B; --ink-2:#5B5C7E; --line:#E7E8F4;
    --shadow:0 6px 28px rgba(99,91,255,.10), 0 1px 3px rgba(23,24,43,.05);
    --shadow-hover:0 16px 48px rgba(99,91,255,.18), 0 2px 6px rgba(23,24,43,.06);
    --r:20px; --r-sm:13px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  }
  html[data-theme="dark"]{
    --primary:#8E7DFF; --primary-2:#A79BFF; --secondary:#43D0D0; --accent:#FF7290;
    --bg:#0F101C; --surface:#191B2A; --surface-2:#232540; --surface-3:#2C2F4C;
    --ink:#EEF0FA; --ink-2:#9DA2C6; --line:#2B2D47;
    --shadow:0 8px 30px rgba(0,0,0,.38), 0 1px 3px rgba(0,0,0,.3);
    --shadow-hover:0 16px 46px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.32);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--font);color:var(--ink);background:var(--bg);min-height:100vh;position:relative;overflow-x:hidden}
  .bg-deco{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(680px 460px at 8% -10%, rgba(108,99,255,.14), transparent 60%),
      radial-gradient(600px 420px at 102% 4%, rgba(62,207,207,.12), transparent 55%),
      radial-gradient(720px 520px at 85% 115%, rgba(255,101,132,.06), transparent 60%);}
  html[data-theme="dark"] .bg-deco{opacity:.55}
  .wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;
    padding:30px 16px calc(96px + env(safe-area-inset-bottom))}
  @media(min-width:720px){.wrap{padding:46px 22px calc(96px + env(safe-area-inset-bottom))}}

  /* 主题切换按钮（固定右下，44px 触控，避开安全区） */
  .theme-toggle{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));
    z-index:50;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
    background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--ink-2);
    transition:transform .18s ease,color .18s ease,box-shadow .18s ease;-webkit-tap-highlight-color:transparent}
  .theme-toggle:hover{transform:translateY(-2px);color:var(--primary);box-shadow:var(--shadow-hover)}
  .theme-toggle:active{transform:scale(.94)}
  .theme-toggle:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
  .theme-toggle svg{width:20px;height:20px}
  .theme-toggle .i-moon{display:none}
  html[data-theme="dark"] .theme-toggle .i-sun{display:none}
  html[data-theme="dark"] .theme-toggle .i-moon{display:block}

  .hero{text-align:center;margin-bottom:26px}
  .hero .kicker{font-size:12.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--primary)}
  .hero h1{font-size:clamp(30px,5vw,46px);font-weight:800;letter-spacing:-.02em;margin-top:8px}
  .hero p{color:var(--ink-2);margin-top:10px;font-size:15px}
  .stats{display:flex;gap:12px;justify-content:center;margin-top:16px;flex-wrap:wrap}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);
    padding:10px 18px;box-shadow:var(--shadow);text-align:center;min-width:104px}
  .stat b{display:block;font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--secondary));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .stat span{font-size:12px;color:var(--ink-2)}

  .controls{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0 22px;align-items:center}
  .search{flex:1;min-width:220px;display:flex;align-items:center;gap:10px;background:var(--surface);
    border:1.5px solid var(--line);border-radius:999px;padding:0 18px;height:50px;box-shadow:var(--shadow);
    transition:border-color .2s ease}
  .search:focus-within{border-color:var(--primary)}
  .search svg{flex:none;opacity:.5}
  .search input{flex:1;border:none;outline:none;background:transparent;font-size:16px;color:var(--ink);font-family:var(--font)}
  .search input::placeholder{color:var(--ink-2);opacity:.75}
  .sort{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);
    border-radius:999px;height:50px;padding:0 16px;box-shadow:var(--shadow)}
  .sort label{font-size:13px;color:var(--ink-2);font-weight:600}
  .sort select{border:none;outline:none;background:transparent;font-size:16px;font-weight:700;color:var(--ink);font-family:var(--font);cursor:pointer}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;
    box-shadow:var(--shadow);text-decoration:none;color:inherit;display:flex;flex-direction:column;
    position:relative;transition:transform .22s cubic-bezier(.2,0,0,1),box-shadow .22s ease;cursor:pointer;
    opacity:0;transform:translateY(14px);animation:rise .55s cubic-bezier(.2,0,0,1) forwards;
    -webkit-tap-highlight-color:transparent}
  @keyframes rise{to{opacity:1;transform:none}}
  .card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover)}
  .card:active{transform:scale(.99)}
  .card:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
  .c-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .c-title{font-size:18px;font-weight:800;letter-spacing:-.01em;line-height:1.3}
  .c-score{flex:none;font-size:13px;font-weight:800;color:#fff;padding:5px 11px;border-radius:999px;
    background:linear-gradient(135deg,var(--primary),var(--primary-2));white-space:nowrap}
  .c-sum{margin-top:10px;color:var(--ink-2);font-size:14px;line-height:1.6;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .c-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .c-tag{font-size:11.5px;font-weight:600;color:var(--primary);background:rgba(108,99,255,.10);
    border:1px solid rgba(108,99,255,.18);padding:3px 9px;border-radius:999px}

  /* 原话标签 + Tip */
  .c-raw{position:relative;margin-top:10px;align-self:flex-start}
  .raw-tag{display:inline-flex;align-items:center;gap:5px;min-height:44px;font-size:12px;font-weight:700;color:var(--primary);
    background:rgba(108,99,255,.10);border:1px solid rgba(108,99,255,.22);padding:6px 14px;border-radius:999px;
    cursor:pointer;user-select:none;transition:background .18s ease,color .18s ease}
  .raw-tag:hover{background:rgba(108,99,255,.18)}
  .raw-tag:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
  .raw-tag svg{width:13px;height:13px}
  .raw-tip{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:30;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-hover);
    padding:12px 14px;font-size:13.5px;color:var(--ink-2);line-height:1.65;white-space:pre-wrap;
    max-height:180px;overflow:auto;
    opacity:0;visibility:hidden;transform:translateY(-4px);
    transition:opacity .18s ease,transform .18s ease,visibility .18s}
  .raw-tip b{display:block;font-size:11.5px;font-weight:700;color:var(--primary);letter-spacing:.05em;margin-bottom:6px}
  .card:hover .raw-tip,
  .card:focus-within .raw-tip,
  .card.raw-open .raw-tip{opacity:1;visibility:visible;transform:none}

  .c-foot{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;
    align-items:center;color:var(--ink-2);font-size:12.5px}
  .c-foot .m-item{display:inline-flex;align-items:center;gap:6px}
  .c-foot .m-item svg{width:14px;height:14px;opacity:.8}
  .c-foot .go{font-weight:700;color:var(--primary);display:inline-flex;align-items:center;gap:5px}
  .c-foot .go svg{width:14px;height:14px}
  .empty{text-align:center;color:var(--ink-2);padding:60px 20px;font-size:15px;display:none}
  .foot{margin-top:36px;text-align:center;color:var(--ink-2);font-size:12.5px;opacity:.7}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    .card{opacity:1;transform:none}
  }
</style>
</head>
<body>
<div class="bg-deco"></div>
<button class="theme-toggle" id="themeBtn" type="button" aria-label="切换深浅色主题">
  <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M19.4 4.6l-1.8 1.8M6.4 17.6l-1.8 1.8"/></svg>
  <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
</button>
<main class="wrap">
  <header class="hero">
    <div class="kicker">Idea Board</div>
    <h1>灵感库</h1>
    <p>抛想法进来，先体检、后动手。每个灵感都有八维评分与可行性分析。</p>
    <div class="stats">
      <div class="stat"><b id="stat-count">0</b><span>灵感总数</span></div>
      <div class="stat"><b id="stat-avg">0.0</b><span>平均评分</span></div>
      <div class="stat"><b id="stat-top">—</b><span>最高评分</span></div>
    </div>
  </header>

  <div class="controls">
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="搜索标题、标签、原话或摘要…" autocomplete="off">
    </label>
    <div class="sort">
      <label for="sort">排序</label>
      <select id="sort">
        <option value="new">最新优先</option>
        <option value="score-desc">评分高→低</option>
        <option value="score-asc">评分低→高</option>
        <option value="title">标题 A→Z</option>
      </select>
    </div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">没有匹配的灵感，换个关键词试试。</div>

  <div class="foot">由 xin-ideas skill 维护 · 数据存于本文件 IDEAS 数组，新增灵感时追加一项即可</div>
</main>

<script>
/* ============================================================
   灵感索引数据 —— 更新时保留原有条目，只增不删，绝不让历史灵感丢失。
   新增灵感时，往这个数组里 push 一项即可。
   file 为相对本文件的路径（ideas/ 子目录下）。score 为综合评分(1-10)。
   raw 为用户原话（原始表达），可为空字符串；卡片上"原话"标签 hover/点击可查看。
   ============================================================ */
const IDEAS = [
  {
    id: "example",
    title: "示例灵感",
    ts: "2026-01-01 00:00",
    tags: ["示例","模板"],
    score: 7.0,
    raw: "这是一条示例原话。新增灵感后它会被真实的想法取代，点卡片上的「原话」标签或悬停卡片即可看到。",
    summary: "这是一条示例卡片，新增灵感后它会被真实的想法取代。点击可跳转到详情页。",
    file: "ideas/idea_example.html"
  }
];

const grid=document.getElementById('grid');
const empty=document.getElementById('empty');
const q=document.getElementById('q');
const sort=document.getElementById('sort');

/* 主题切换 */
(function(){
  const btn=document.getElementById('themeBtn');
  function apply(t){document.documentElement.setAttribute('data-theme',t);
    btn.setAttribute('aria-label',t==='dark'?'切换到浅色主题':'切换到深色主题');
    try{localStorage.setItem('xin-ideas-theme',t)}catch(e){}}
  btn.addEventListener('click',()=>{
    apply(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
  });
})();

function cardColor(v){
  if(v>=8) return "linear-gradient(135deg,#3ECFCF,#6C63FF)";
  if(v>=6) return "linear-gradient(135deg,#8B7BFF,#6C63FF)";
  if(v>=4) return "linear-gradient(135deg,#FFB36B,#FFA94D)";
  return "linear-gradient(135deg,#FF8DA3,#FF6584)";
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

const rawBlock = it => (it.raw && String(it.raw).trim()) ? `
  <div class="c-raw">
    <span class="raw-tag" role="button" tabindex="0" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.4 11C4.9 11 3.6 12.3 3.6 13.9c0 1.6 1.3 2.9 2.9 2.9.2 0 .4 0 .5-.1-.3 1.6-1.7 2.8-3.4 2.8v1.2c3 0 5.4-2.4 5.4-5.4v-3.2A3.1 3.1 0 0 0 6.4 11z"/><path d="M17.8 11c-1.5 0-2.8 1.3-2.8 2.9 0 1.6 1.3 2.9 2.9 2.9.2 0 .4 0 .5-.1-.3 1.6-1.7 2.8-3.4 2.8v1.2c3 0 5.4-2.4 5.4-5.4v-3.2a3.1 3.1 0 0 0-2.6-3.1z"/></svg>
      原话
    </span>
    <div class="raw-tip"><b>原话</b>${esc(it.raw)}</div>
  </div>` : '';

function render(){
  const kw=q.value.trim().toLowerCase();
  let list=IDEAS.filter(it=>{
    if(!kw) return true;
    return (it.title+it.summary+(it.raw||'')+(it.tags||[]).join(' ')).toLowerCase().includes(kw);
  });
  const s=sort.value;
  list.sort((a,b)=>{
    if(s==='new') return b.ts.localeCompare(a.ts);
    if(s==='score-desc') return b.score-a.score;
    if(s==='score-asc') return a.score-b.score;
    return a.title.localeCompare(b.title,'zh');
  });

  grid.innerHTML=list.map((it,i)=>`
    <a class="card" href="${esc(it.file)}" target="_blank" rel="noopener" style="animation-delay:${i*0.05}s">
      <div class="c-top">
        <div class="c-title">${esc(it.title)}</div>
        <div class="c-score" style="background:${cardColor(it.score)}">${(Number(it.score)||0).toFixed(1)}</div>
      </div>
      <div class="c-sum">${esc(it.summary)}</div>
      <div class="c-tags">${(it.tags||[]).map(t=>`<span class="c-tag">${esc(t)}</span>`).join('')}</div>
      ${rawBlock(it)}
      <div class="c-foot">
        <span class="m-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          ${esc(it.ts)}
        </span>
        <span class="go">查看详情
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </span>
      </div>
    </a>`).join('');

  empty.style.display=list.length?'none':'block';
}

/* 原话标签：点击/回车切换展开，阻止跳转 */
grid.addEventListener('click',e=>{
  const tag=e.target.closest('.raw-tag');
  if(!tag){ return; }
  e.preventDefault();
  const card=tag.closest('.card');
  const open=card.classList.toggle('raw-open');
  tag.setAttribute('aria-expanded',open?'true':'false');
});
grid.addEventListener('keydown',e=>{
  const tag=e.target.closest('.raw-tag');
  if(!tag || (e.key!=='Enter' && e.key!==' ')){ return; }
  e.preventDefault();
  const card=tag.closest('.card');
  const open=card.classList.toggle('raw-open');
  tag.setAttribute('aria-expanded',open?'true':'false');
});

// 统计
document.getElementById('stat-count').textContent=IDEAS.length;
const avg=IDEAS.reduce((s,i)=>s+Number(i.score),0)/(IDEAS.length||1);
document.getElementById('stat-avg').textContent=avg.toFixed(1);
document.getElementById('stat-top').textContent=IDEAS.length?Math.max(...IDEAS.map(i=>Number(i.score))).toFixed(1):'—';

q.addEventListener('input',render);
sort.addEventListener('change',render);
render();
</script>
</body>
</html>
