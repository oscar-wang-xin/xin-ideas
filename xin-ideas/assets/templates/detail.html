<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>灵感详情</title>
<script>
/* 主题初始化：默认浅色；读取本地偏好，避免闪烁 */
try{
  if(localStorage.getItem('xin-ideas-theme')==='dark'){
    document.documentElement.setAttribute('data-theme','dark');
  }
}catch(e){}
</script>
<style>
  :root{
    --primary:#6C63FF; --primary-2:#8B7BFF; --secondary:#3ECFCF; --accent:#FF6584;
    --good:#18A98F; --warn:#F08C20; --bad:#F0566F;
    --bg:#F6F7FC; --surface:#FFFFFF; --surface-2:#EFF1FA; --surface-3:#E6E8F6;
    --ink:#17182B; --ink-2:#5B5C7E; --line:#E7E8F4;
    --shadow:0 6px 28px rgba(99,91,255,.10), 0 1px 3px rgba(23,24,43,.05);
    --shadow-hover:0 14px 44px rgba(99,91,255,.16), 0 2px 6px rgba(23,24,43,.06);
    --r:18px; --r-sm:12px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  }
  html[data-theme="dark"]{
    --primary:#8E7DFF; --primary-2:#A79BFF; --secondary:#43D0D0; --accent:#FF7290;
    --good:#28C9AC; --warn:#FFA94F; --bad:#FF6E87;
    --bg:#0F101C; --surface:#191B2A; --surface-2:#232540; --surface-3:#2C2F4C;
    --ink:#EEF0FA; --ink-2:#9DA2C6; --line:#2B2D47;
    --shadow:0 8px 30px rgba(0,0,0,.38), 0 1px 3px rgba(0,0,0,.3);
    --shadow-hover:0 16px 46px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.32);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.65;min-height:100vh;position:relative;overflow-x:hidden}
  .bg-deco{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(620px 420px at 12% -8%, rgba(108,99,255,.14), transparent 60%),
      radial-gradient(560px 400px at 100% 0%, rgba(62,207,207,.12), transparent 55%),
      radial-gradient(700px 500px at 80% 110%, rgba(255,101,132,.06), transparent 60%);}
  html[data-theme="dark"] .bg-deco{opacity:.55}
  .wrap{position:relative;z-index:1;max-width:940px;margin:0 auto;
    padding:32px 18px calc(96px + env(safe-area-inset-bottom))}
  @media(min-width:720px){.wrap{padding:44px 22px calc(96px + env(safe-area-inset-bottom))}}

  /* 主题切换按钮（固定右下，44px 触控，避开安全区） */
  .theme-toggle{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));
    z-index:50;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
    background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--ink-2);
    transition:transform .18s ease,color .18s ease,box-shadow .18s ease;touch-action:none;-webkit-tap-highlight-color:transparent}
  .theme-toggle:hover{transform:translateY(-2px);color:var(--primary);box-shadow:var(--shadow-hover)}
  .theme-toggle:active{transform:scale(.94)}
  .theme-toggle:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
  .theme-toggle svg{width:20px;height:20px}
  .theme-toggle.dragging{transition:none;opacity:.8}
  .theme-toggle .i-moon{display:none}
  html[data-theme="dark"] .theme-toggle .i-sun{display:none}
  html[data-theme="dark"] .theme-toggle .i-moon{display:block}

  .reveal{opacity:0;transform:translateY(16px);animation:rise .6s cubic-bezier(.2,0,0,1) forwards}
  @keyframes rise{to{opacity:1;transform:none}}

  /* Hero */
  .hero{margin-bottom:22px}
  @media(max-width:820px){.hero{padding-right:56px}} /* 避开右上角关闭按钮 */
  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .tag{font-size:12.5px;font-weight:600;color:var(--primary);
    background:linear-gradient(135deg,rgba(108,99,255,.12),rgba(62,207,207,.12));
    border:1px solid rgba(108,99,255,.20);padding:5px 12px;border-radius:999px}
  .h-title{font-size:clamp(26px,4.6vw,42px);font-weight:800;letter-spacing:-.02em;line-height:1.18}
  .h-meta{margin-top:12px;color:var(--ink-2);font-size:14px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .h-meta .m-item{display:inline-flex;align-items:center;gap:6px}
  .h-meta svg{width:15px;height:15px;opacity:.8}
  .h-meta .dot{width:4px;height:4px;border-radius:50%;background:var(--line)}

  /* 原话引用 */
  .raw{margin-top:18px;padding:14px 16px 14px 18px;background:var(--surface-2);
    border:1px solid var(--line);border-left:4px solid var(--primary);
    border-radius:var(--r-sm) var(--r-sm) var(--r-sm) var(--r-sm)}
  .raw-head{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--ink-2);
    letter-spacing:.06em;margin-bottom:6px}
  .raw-head svg{width:15px;height:15px;color:var(--primary)}
  .raw p{font-size:15px;color:var(--ink);white-space:pre-wrap;line-height:1.7}

  .summary{margin-top:14px;font-size:16px;color:var(--ink);background:var(--surface);
    border:1px solid var(--line);border-radius:var(--r-sm);padding:16px 18px;box-shadow:var(--shadow)}

  /* 综合评分卡 */
  .scorecard{display:flex;align-items:center;gap:20px;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin:20px 0;box-shadow:var(--shadow)}
  .score-num{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1;
    background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;background-clip:text;color:transparent}
  .score-side{flex:1}
  .score-side .grade{display:inline-block;font-size:13px;font-weight:700;color:#fff;
    background:linear-gradient(135deg,var(--primary),var(--primary-2));padding:3px 10px;border-radius:999px;margin-bottom:6px}
  .score-side .sub{color:var(--ink-2);font-size:13.5px}
  .score-bar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:10px}
  .score-bar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--primary),var(--secondary));transition:width .8s cubic-bezier(.2,0,0,1)}

  /* 网格 */
  .grid{display:grid;grid-template-columns:340px 1fr;gap:20px;margin:8px 0 28px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
  .panel h3{font-size:13.5px;font-weight:700;color:var(--ink-2);letter-spacing:.04em;text-transform:uppercase;margin-bottom:12px}
  .radar-wrap{display:flex;justify-content:center}
  .radar{max-width:100%;height:auto}
  .radar text{font-size:11px;font-weight:600;fill:var(--ink)}
  .radar .axis{stroke:var(--line);stroke-width:1}
  .radar .grid-c{fill:none;stroke:var(--line);stroke-width:1}
  .radar .data{fill:rgba(108,99,255,.18);stroke:var(--primary);stroke-width:2.5;stroke-linejoin:round}

  .bars{display:flex;flex-direction:column;gap:13px}
  .bar-row{display:grid;grid-template-columns:96px 1fr 36px;align-items:center;gap:12px}
  .bar-row .name{font-size:14px;font-weight:600}
  .bar-track{height:9px;border-radius:999px;background:var(--surface-2);overflow:hidden}
  .bar-track > i{display:block;height:100%;border-radius:999px;transition:width .8s cubic-bezier(.2,0,0,1)}
  .bar-row .val{font-size:14px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}

  /* 区块标题 */
  .section-title{font-size:20px;font-weight:800;letter-spacing:-.01em;margin:36px 0 14px;display:flex;align-items:center;gap:10px}
  .section-title::before{content:"";width:5px;height:20px;border-radius:999px;background:linear-gradient(180deg,var(--primary),var(--secondary))}

  /* 八维评价卡 */
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:820px){.cards{grid-template-columns:1fr}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:16px 18px;
    box-shadow:var(--shadow);transition:transform .2s ease,box-shadow .2s ease}
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
  .card h4{font-size:15.5px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .card h4 .pill{font-size:11px;font-weight:800;color:#fff;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--primary),var(--primary-2))}
  .card p{font-size:14.5px;color:var(--ink-2);white-space:pre-wrap}
  .card p + p{margin-top:10px}

  /* 好处 / 坏处 */
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:820px){.duo{grid-template-columns:1fr}}
  .col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:16px 18px;box-shadow:var(--shadow)}
  .col h4{font-size:15.5px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .col.good h4{color:var(--good)} .col.bad h4{color:var(--bad)}
  .ul{list-style:none;display:flex;flex-direction:column;gap:11px}
  .ul li{position:relative;padding-left:26px;font-size:14.5px;color:var(--ink-2)}
  .ul li::before{position:absolute;left:0;top:1px;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;
    font-size:11px;font-weight:800;color:#fff}
  .col.good .ul li::before{content:"✓";background:var(--good)}
  .col.bad .ul li::before{content:"!";background:var(--bad)}

  /* 问题与应对 */
  .risks{display:flex;flex-direction:column;gap:12px}
  .risk{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--warn);
    border-radius:var(--r-sm);padding:16px 18px;box-shadow:var(--shadow)}
  .risk .q{font-size:15px;font-weight:700;display:flex;gap:9px;align-items:flex-start}
  .risk .q .ic{flex:none;color:var(--warn);font-weight:900}
  .risk .a{margin-top:9px;font-size:14.5px;color:var(--ink-2);padding-left:26px}
  .risk .a b{color:var(--primary);font-weight:700}

  /* 路线图 */
  .tl{position:relative;padding-left:30px}
  .tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;
    background:linear-gradient(180deg,var(--primary),var(--secondary))}
  .tl-item{position:relative;margin-bottom:18px}
  .tl-item:last-child{margin-bottom:0}
  .tl-item::before{content:"";position:absolute;left:-30px;top:4px;width:16px;height:16px;border-radius:50%;
    background:var(--surface);border:3px solid var(--primary);box-shadow:0 0 0 4px rgba(108,99,255,.12)}
  .tl-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:16px 18px;box-shadow:var(--shadow)}
  .tl-card .ph{display:inline-block;font-size:12px;font-weight:800;color:#fff;padding:3px 11px;border-radius:999px;margin-bottom:8px;
    background:linear-gradient(135deg,var(--primary),var(--primary-2))}
  .tl-card .goal{font-size:15px;font-weight:700;margin-bottom:8px}
  .tl-card .steps{list-style:none;display:flex;flex-direction:column;gap:7px}
  .tl-card .steps li{position:relative;padding-left:20px;font-size:14.5px;color:var(--ink-2)}
  .tl-card .steps li::before{content:"";position:absolute;left:4px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--primary-2)}
  .tl-card .done{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13.5px;color:var(--good);font-weight:600}

  /* 要避免的坑 */
  .avoid{background:linear-gradient(180deg,rgba(255,101,132,.05),rgba(255,101,132,.02));
    border:1px solid rgba(255,101,132,.24);border-radius:var(--r-sm);padding:18px 20px}
  html[data-theme="dark"] .avoid{background:linear-gradient(180deg,rgba(255,110,135,.08),rgba(255,110,135,.02))}
  .avoid .ul li::before{content:"✕";background:var(--bad)}

  /* 成功/失败判据 */
  .metrics{display:flex;flex-direction:column;gap:10px}
  .mrow{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 16px;box-shadow:var(--shadow);align-items:center}
  .mrow .m-name{font-size:14.5px;font-weight:700}
  .mrow .m-ok,.mrow .m-no{font-size:13.5px;display:flex;gap:7px;align-items:flex-start}
  .mrow .m-ok{color:var(--good)} .mrow .m-no{color:var(--bad)}
  .mrow .m-ok b,.mrow .m-no b{flex:none;font-weight:900}
  @media(max-width:820px){.mrow{grid-template-columns:1fr;gap:6px}}

  /* 成本投入 */
  .cost{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:820px){.cost{grid-template-columns:1fr}}
  .cost-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:16px;box-shadow:var(--shadow);text-align:center}
  .cost-card .cv{font-size:22px;font-weight:800;letter-spacing:-.02em;
    background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;background-clip:text;color:transparent}
  .cost-card .cl{font-size:12.5px;font-weight:700;color:var(--ink-2);margin-top:4px;letter-spacing:.04em}
  .cost-card .cn{font-size:12.5px;color:var(--ink-2);margin-top:7px;opacity:.85}
  .cost-other{margin-top:12px;font-size:14px;color:var(--ink-2);background:var(--surface-2);border-radius:var(--r-sm);padding:13px 16px}
  .cost-other b{color:var(--ink)}

  .back{display:inline-flex;align-items:center;gap:8px;margin-top:36px;font-weight:700;color:var(--primary);text-decoration:none;font-size:15px;
    background:var(--surface);border:1px solid var(--line);padding:12px 20px;border-radius:999px;box-shadow:var(--shadow);
    transition:transform .2s ease,box-shadow .2s ease}
  .back:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}
  .back:active{transform:scale(.98)}
  .back svg{width:16px;height:16px}
  .foot{margin-top:26px;text-align:center;color:var(--ink-2);font-size:12.5px;opacity:.7}

  /* 关闭按钮（固定右上） */
  .close-btn{position:fixed;right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));
    z-index:50;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
    background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--ink-2);
    transition:transform .18s ease,color .18s ease,box-shadow .18s ease;-webkit-tap-highlight-color:transparent}
  .close-btn:hover{transform:translateY(-2px);color:var(--primary);box-shadow:var(--shadow-hover)}
  .close-btn:active{transform:scale(.94)}
  .close-btn:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
  .close-btn svg{width:18px;height:18px}

  /* 返回顶部（可拖动） */
  .to-top{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:calc(70px + env(safe-area-inset-bottom));
    z-index:50;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
    background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-hover);color:var(--primary);
    transition:transform .18s ease,box-shadow .18s ease,opacity .18s ease;touch-action:none;
    -webkit-tap-highlight-color:transparent}
  .to-top:hover{transform:translateY(-2px)}
  .to-top:active{transform:scale(.94)}
  .to-top:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
  .to-top svg{width:20px;height:20px}
  .to-top.dragging{transition:none;opacity:.8}
  .to-top[hidden]{display:none}

  /* 动效亲和 */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    .reveal{opacity:1;transform:none}
  }
</style>
</head>
<body>
<div class="bg-deco"></div>
<button class="theme-toggle" id="themeBtn" type="button" aria-label="切换深浅色主题">
  <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M19.4 4.6l-1.8 1.8M6.4 17.6l-1.8 1.8"/></svg>
  <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
</button>
<button class="close-btn" id="closeBtn" type="button" aria-label="关闭本页">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
</button>
<button class="to-top" id="toTop" type="button" aria-label="返回顶部" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>
<main class="wrap" id="app"></main>

<script>
/* ============================================================
   灵感详情数据对象 —— 复制模板后，只改这个对象里的字段即可。
   评分维度固定 8 个；scores 为 1-10 整数。
   拆解字段要求“具体可落地”，禁止只写方向与概念：
     raw     用户原话（原始表达，尽量逐字保留；可为空字符串）
     pros    好处（收益），字符串数组
     cons    坏处（代价/风险），字符串数组
     risks   可能遇到的问题，[{q:"问题", a:"应对"}]
     roadmap 分阶段落地计划，[{phase:"阶段名", goal:"目标", steps:[...], done:"完成标志"}]
     avoid   要避免的坑，字符串数组
     metrics 成功/失败判据，[{name:"指标", target:"成功线", fail:"失败线"}]
     cost    成本投入，{effort:{v,n}, time:{v,n}, money:{v,n}, other:"其它代价"}
   ============================================================ */
const IDEA = {
  title: "（灵感标题）",
  ts: "2026-01-01 00:00",
  tags: ["分类标签", "示例"],
  raw: "用户抛想法时的原话，尽量逐字保留。",
  summary: "一句话讲清这个灵感解决什么、为什么值得做。",
  scores: {
    "解决问题": 7, "实用性": 7, "市场价值": 7, "竞品分析": 7,
    "变现可能": 7, "技术方案": 7, "可扩展性": 7, "实现计划": 7
  },
  details: {
    "解决问题": "描述它解决了什么真实痛点，谁在痛。",
    "实用性": "在日常/工作场景中可被使用的程度与频率。",
    "市场价值": "目标人群规模、付费意愿、市场阶段。",
    "竞品分析": "已有玩家、他们的短板、本想法的差异化与壁垒。",
    "变现可能": "可行的变现路径（订阅/一次性/渠道替卖等）与可行性。",
    "技术方案": "实现思路、关键技术选型、可行性评估。",
    "可扩展性": "未来可延展的方向、复用与组合空间。",
    "实现计划": "分阶段落地步骤（MVP→加载背书→放大）。"
  },
  pros: ["收益点一（最好能算清账，如省下多少时间/多少钱）", "收益点二"],
  cons: ["代价一（时间/金钱/精力/机会成本）", "风险点二"],
  risks: [
    { q: "可能遇到的问题", a: "具体应对办法" }
  ],
  roadmap: [
    { phase: "第 0 步 · 验证", goal: "用最小代价判断值不值得做", steps: ["动作一", "动作二"], done: "达到什么状态算这一步完成" }
  ],
  avoid: ["最容易犯、且代价很高的错，一条条列清"],
  metrics: [
    { name: "核心指标", target: "达到即算成功的线", fail: "跌破即应止损的线" }
  ],
  cost: {
    effort: { v: "约 X 人日", n: "开发和调试的精力投入" },
    time:   { v: "X 周",     n: "从启动到可用/上线" },
    money:  { v: "≈ ¥X",     n: "服务器、API、工具等现金支出" },
    other:  "机会成本：这段时间挤占了哪些其他项目"
  }
};

/* ===================== 渲染逻辑（一般无需改动） ===================== */
const DIMS = Object.keys(IDEA.scores);
document.title = IDEA.title && String(IDEA.title).trim() ? `${IDEA.title} · 灵感详情` : "灵感详情";
const MAX = 10;
const mean = DIMS.reduce((s,k)=>s+(Number(IDEA.scores[k])||0),0)/DIMS.length;
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* 可拖动浮层按钮：拖拽贴边吸附、边界限制、resize 重钳位；非拖动松手派发 tap */
function makeDraggable(el,{bottomSafe=0}={}){
  const EDGE=8, DRAG_TOL=5;
  let drag=null, moved=false;
  function clamp(v,min,max){ return Math.min(Math.max(v,min),max); }
  function reClamp(){
    if(el.style.left==='') return; // 未拖过：保持 CSS right/bottom 定位
    const w=el.offsetWidth, h=el.offsetHeight;
    el.style.left=clamp(parseFloat(el.style.left)||0,0,innerWidth-w-EDGE)+'px';
    el.style.top =clamp(parseFloat(el.style.top)||0,0,innerHeight-h-bottomSafe-EDGE)+'px';
  }
  window.addEventListener('resize',reClamp,{passive:true});
  el.addEventListener('pointerdown',e=>{
    drag={ sx:e.clientX, sy:e.clientY,
           ox:parseFloat(el.style.left)||el.offsetLeft,
           oy:parseFloat(el.style.top)||el.offsetTop };
    moved=false;
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
  });
  el.addEventListener('pointermove',e=>{
    if(!drag) return;
    const dx=e.clientX-drag.sx, dy=e.clientY-drag.sy;
    if(Math.abs(dx)+Math.abs(dy)>DRAG_TOL) moved=true;
    if(moved){
      const w=el.offsetWidth, h=el.offsetHeight;
      el.classList.add('dragging');
      el.style.left=clamp(drag.ox+dx,0,innerWidth-w-EDGE)+'px';
      el.style.top =clamp(drag.oy+dy,0,innerHeight-h-bottomSafe-EDGE)+'px';
      el.style.right='auto'; el.style.bottom='auto';
    }
  });
  function finish(){
    if(!drag) return;
    el.classList.remove('dragging');
    if(!moved){
      el.dispatchEvent(new CustomEvent('tap'));
    }else{
      const w=el.offsetWidth, h=el.offsetHeight;
      const x=parseFloat(el.style.left)||0;
      const y=parseFloat(el.style.top)||0;
      el.style.left=(x<innerWidth/2?EDGE:innerWidth-w-EDGE)+'px';
      el.style.top =clamp(y,0,innerHeight-h-bottomSafe-EDGE)+'px';
    }
    drag=null;
  }
  el.addEventListener('pointerup',finish);
  el.addEventListener('pointercancel',()=>{ drag=null; moved=false; el.classList.remove('dragging'); });
}

/* 主题切换（按钮可拖动，拖完不误触） */
(function(){
  const btn=document.getElementById('themeBtn');
  function apply(t){document.documentElement.setAttribute('data-theme',t);
    btn.setAttribute('aria-label',t==='dark'?'切换到浅色主题':'切换到深色主题');
    try{localStorage.setItem('xin-ideas-theme',t)}catch(e){}}
  btn.addEventListener('tap',()=>{
    apply(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
  });
  makeDraggable(btn);
})();

/* 关闭本页：优先 window.close()（新标签可用），失败则回列表页 */
(function(){
  const btn=document.getElementById('closeBtn');
  btn.addEventListener('click',()=>{
    window.close();
    setTimeout(()=>{ location.href='../index.html'; },150);
  });
})();

/* 返回顶部（可拖动） */
(function(){
  const toTop=document.getElementById('toTop');
  /* BOTTOM_SAFE：默认布局下与主题按钮互不重叠 */
  const SHOW_AFTER=400, BOTTOM_SAFE=78;
  const mq=matchMedia('(prefers-reduced-motion: reduce)');
  let reduce=mq.matches;
  mq.addEventListener('change',()=>{ reduce=mq.matches; });

  function show(){ toTop.hidden = window.scrollY < SHOW_AFTER; }
  window.addEventListener('scroll', show, {passive:true});
  show();

  toTop.addEventListener('tap',()=>{
    window.scrollTo({top:0, behavior: reduce?'auto':'smooth'});
  });
  makeDraggable(toTop,{bottomSafe:BOTTOM_SAFE});
})();

function grade(m){ if(m>=8.5)return"S"; if(m>=7.5)return"A"; if(m>=6.5)return"B"; if(m>=5.5)return"C"; return"D"; }
function barColor(v){
  if(v>=8) return "linear-gradient(90deg,#3ECFCF,#6C63FF)";
  if(v>=6) return "linear-gradient(90deg,#8B7BFF,#6C63FF)";
  if(v>=4) return "linear-gradient(90deg,#FFB36B,#FFA94D)";
  return "linear-gradient(90deg,#FF8DA3,#FF6584)";
}
function radarSVG(){
  const cx=180,cy=180,R=120,n=DIMS.length,step=Math.PI*2/n; let g='';
  [2,4,6,8,10].forEach(ring=>{
    const r=R*ring/MAX; let pts=[];
    for(let i=0;i<n;i++){const a=-Math.PI/2+i*step;pts.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1));}
    g+=`<polygon class="grid-c" points="${pts.join(' ')}"/>`;
  });
  DIMS.forEach((d,i)=>{
    const a=-Math.PI/2+i*step, x=cx+R*Math.cos(a), y=cy+R*Math.sin(a);
    g+=`<line class="axis" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`;
    const lx=cx+(R+22)*Math.cos(a), ly=cy+(R+22)*Math.sin(a);
    let anchor="middle"; if(Math.cos(a)>0.3)anchor="start"; else if(Math.cos(a)<-0.3)anchor="end";
    g+=`<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}">${esc(d)}</text>`;
  });
  let dp=[];
  DIMS.forEach((d,i)=>{const a=-Math.PI/2+i*step, rr=R*(Number(IDEA.scores[d])||0)/MAX;
    dp.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1));});
  g+=`<polygon class="data" points="${dp.join(' ')}"/>`;
  return `<svg class="radar" width="360" height="360" viewBox="0 0 360 360">${g}</svg>`;
}
const barsHTML = () => DIMS.map(d=>{const v=Number(IDEA.scores[d])||0;
  return `<div class="bar-row"><span class="name">${esc(d)}</span>
    <span class="bar-track"><i style="width:0%;background:${barColor(v)}" data-w="${(v/MAX*100).toFixed(0)}%"></i></span>
    <span class="val">${v}</span></div>`;}).join('');
const cardsHTML = () => DIMS.map((d,i)=>{
  const paras=String(IDEA.details[d]||"").split(/\n\n+/).map(p=>`<p>${esc(p.trim())}</p>`).join('');
  return `<div class="card"><h4><span class="pill">${i+1}</span>${esc(d)}</h4>${paras}</div>`;}).join('');

const sec = (title, inner) => (inner && inner.trim()) ? `<div class="section-title reveal">${esc(title)}</div>${inner}` : '';
const ulHTML = arr => (arr&&arr.length) ? `<ul class="ul">${arr.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>` : '';

function render(){
  const rawH = IDEA.raw && String(IDEA.raw).trim() ? `
    <blockquote class="raw reveal">
      <div class="raw-head">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.4 11C4.9 11 3.6 12.3 3.6 13.9c0 1.6 1.3 2.9 2.9 2.9.2 0 .4 0 .5-.1-.3 1.6-1.7 2.8-3.4 2.8v1.2c3 0 5.4-2.4 5.4-5.4v-3.2A3.1 3.1 0 0 0 6.4 11z"/><path d="M17.8 11c-1.5 0-2.8 1.3-2.8 2.9 0 1.6 1.3 2.9 2.9 2.9.2 0 .4 0 .5-.1-.3 1.6-1.7 2.8-3.4 2.8v1.2c3 0 5.4-2.4 5.4-5.4v-3.2a3.1 3.1 0 0 0-2.6-3.1z"/></svg>
        <span>原话</span>
      </div>
      <p>${esc(IDEA.raw)}</p>
    </blockquote>` : '';

  const dua = (IDEA.pros&&IDEA.pros.length)||(IDEA.cons&&IDEA.cons.length) ? `
    <div class="duo reveal">
      <div class="col good"><h4>好处（值不值得做的理由）</h4>${ulHTML(IDEA.pros)}</div>
      <div class="col bad"><h4>坏处与代价</h4>${ulHTML(IDEA.cons)}</div>
    </div>` : '';

  const risksH = (IDEA.risks&&IDEA.risks.length) ? `<div class="risks reveal">${IDEA.risks.map(r=>`
    <div class="risk"><div class="q"><span class="ic">?</span><span>${esc(r.q)}</span></div>
    <div class="a"><b>应对：</b>${esc(r.a)}</div></div>`).join('')}</div>` : '';

  const roadH = (IDEA.roadmap&&IDEA.roadmap.length) ? `<div class="tl reveal">${IDEA.roadmap.map(m=>`
    <div class="tl-item"><div class="tl-card"><span class="ph">${esc(m.phase)}</span>
      <div class="goal">${esc(m.goal)}</div>
      <ul class="steps">${(m.steps||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
      ${m.done?`<div class="done">✔ 完成标志：${esc(m.done)}</div>`:''}
    </div></div>`).join('')}</div>` : '';

  const avoidH = (IDEA.avoid&&IDEA.avoid.length) ? `<div class="avoid reveal">${ulHTML(IDEA.avoid)}</div>` : '';

  const metH = (IDEA.metrics&&IDEA.metrics.length) ? `<div class="metrics reveal">${IDEA.metrics.map(m=>`
    <div class="mrow"><span class="m-name">${esc(m.name)}</span>
      <span class="m-ok"><b>✔</b><span>成功线：${esc(m.target)}</span></span>
      <span class="m-no"><b>✕</b><span>止损线：${esc(m.fail)}</span></span></div>`).join('')}</div>` : '';

  const c = IDEA.cost||{};
  const costH = (c.effort||c.time||c.money) ? `
    <div class="cost reveal">
      ${c.effort?`<div class="cost-card"><div class="cv">${esc(c.effort.v)}</div><div class="cl">精力</div><div class="cn">${esc(c.effort.n||'')}</div></div>`:''}
      ${c.time?`<div class="cost-card"><div class="cv">${esc(c.time.v)}</div><div class="cl">时间</div><div class="cn">${esc(c.time.n||'')}</div></div>`:''}
      ${c.money?`<div class="cost-card"><div class="cv">${esc(c.money.v)}</div><div class="cl">金钱</div><div class="cn">${esc(c.money.n||'')}</div></div>`:''}
    </div>${c.other?`<div class="cost-other reveal"><b>其它代价：</b>${esc(c.other)}</div>`:''}` : '';

  document.getElementById('app').innerHTML = `
    <header class="hero reveal">
      <div class="tags">${(IDEA.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
      <h1 class="h-title">${esc(IDEA.title)}</h1>
      <div class="h-meta">
        <span class="m-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>${esc(IDEA.ts)}</span>
        <span class="dot"></span>
        <span>综合评分 ${mean.toFixed(1)} / 10</span>
      </div>
      ${rawH}
      <div class="summary">${esc(IDEA.summary)}</div>
    </header>
    <div class="scorecard reveal" style="animation-delay:.05s">
      <div class="score-num">${mean.toFixed(1)}</div>
      <div class="score-side">
        <span class="grade">${grade(mean)} 级</span>
        <div class="sub">综合评分 · 满分 10 · 基于 ${DIMS.length} 个维度均值</div>
        <div class="score-bar"><i style="width:0%" data-w="${(mean/MAX*100).toFixed(0)}%"></i></div>
      </div>
    </div>
    <div class="grid">
      <div class="panel reveal" style="animation-delay:.1s"><h3>维度雷达</h3><div class="radar-wrap">${radarSVG()}</div></div>
      <div class="panel reveal" style="animation-delay:.15s"><h3>分项评分</h3><div class="bars">${barsHTML()}</div></div>
    </div>
    ${sec("八维深度评价", `<div class="cards reveal" style="animation-delay:.05s">${cardsHTML()}</div>`)}
    ${sec("收益 vs 代价", dua)}
    ${sec("可能遇到的问题与应对", risksH)}
    ${sec("落地路线图", roadH)}
    ${sec("要避免的坑", avoidH)}
    ${sec("成功 / 失败判据（随时可评判）", metH)}
    ${sec("成本投入", costH)}
    <a class="back" href="../index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      返回灵感库
    </a>
    <div class="foot">由 xin-ideas skill 生成 · 灵感不做评判，只做体检</div>
  `;
  requestAnimationFrame(()=>{document.querySelectorAll('[data-w]').forEach(el=>{el.style.width=el.getAttribute('data-w');});});
}
render();
</script>
