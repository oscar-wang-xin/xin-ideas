<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>灵感详情</title>
<style>
  :root{
    --primary:#6C63FF; --primary-2:#8B7BFF; --secondary:#3ECFCF; --accent:#FF6584;
    --good:#22B8A0; --warn:#FF9F45; --bad:#FF6584;
    --bg:#F7F8FD; --surface:#FFFFFF; --surface-2:#F4F5FC;
    --ink:#1A1A2E; --ink-2:#5A5A7A; --line:#E8E9F5;
    --shadow:0 6px 28px rgba(var(--primary-rgb),.10), 0 1px 3px rgba(var(--ink-rgb),.05);
    --shadow-hover:0 14px 44px rgba(var(--primary-rgb),.16), 0 2px 6px rgba(var(--ink-rgb),.06);
    --r:18px; --r-sm:11px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  }

  /* ===== 主题变量 =====================================================
     AURORA（蓝紫极光）为默认；切到 ROBOT（冷白机甲）时由
     html[data-theme="robot"] 覆盖。所有色值都走变量，故 JS 里也不要
     硬写颜色（横幅/评分条用 var(--bar-*)）。
     ================================================================== */
  :root{
    --primary-rgb:108,99,255;
    --secondary-rgb:62,207,207;
    --bad-rgb:255,101,132;
    --ink-rgb:20,20,50;
    --muted-a:#B6BBD2; --muted-b:#9AA0BE;
    --bad-ink:#B23A52;
    /* 分项评分条色阶（≥8 / ≥6 / ≥4 / 其余） */
    --bar1a:#3ECFCF; --bar1b:#6C63FF;
    --bar2a:#8B7BFF; --bar2b:#6C63FF;
    --bar3a:#FFB36B; --bar3b:#FFA94D;
    --bar4a:#FF8DA3; --bar4b:#FF6584;
  }
  /* —— ROBOT · 冷白机甲：近黑 + 冷蓝灰 + 白，方角、细线、单色钢灰阶 —— */
  html[data-theme="robot"]{
    --primary:#232A38; --primary-2:#3E4759; --secondary:#7A8598;
    --accent:#8A94A8;
    --good:#3F7D6B; --warn:#A2762F; --bad:#B4555F;
    --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#E9ECF1;
    --ink:#14171E; --ink-2:#5C6473; --line:#DCE0E7;
    --primary-rgb:35,42,56;
    --secondary-rgb:122,133,152;
    --bad-rgb:180,85,95;
    --ink-rgb:20,23,30;
    --muted-a:#AEB6C2; --muted-b:#8C95A4;
    --bad-ink:#9A3F49;
    --shadow:0 1px 2px rgba(20,23,30,.05), 0 10px 26px rgba(20,23,30,.055);
    --shadow-hover:0 2px 4px rgba(20,23,30,.06), 0 18px 40px rgba(20,23,30,.10);
    --r:10px; --r-sm:7px;
    --bar1a:#3C4657; --bar1b:#151A23;
    --bar2a:#8A94A6; --bar2b:#5C6473;
    --bar3a:#C79A55; --bar3b:#A2762F;
    --bar4a:#C4707A; --bar4b:#A44B55;
  }
  /* 冷白机甲的背景：去掉彩色光晕，换成冷灰网格 + 极淡钢色晕 */
  html[data-theme="robot"] .bg-deco{background:
      radial-gradient(560px 380px at 14% -10%, rgba(var(--primary-rgb),.07), transparent 62%),
      radial-gradient(520px 360px at 100% 2%, rgba(var(--secondary-rgb),.13), transparent 58%),
      linear-gradient(180deg,rgba(255,255,255,.7),transparent 42%);}
  html[data-theme="robot"] .bg-grid{opacity:.6;
    background-image:linear-gradient(rgba(var(--primary-rgb),.07) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(var(--primary-rgb),.07) 1px,transparent 1px);
    background-size:28px 28px;}
  /* 机甲感细节：小写字距的上位标题 + 区块标题的实心导轨 + 方角 */
  html[data-theme="robot"] .panel h3{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    letter-spacing:.10em;font-weight:700}
  html[data-theme="robot"] .section-title{padding-bottom:10px;border-bottom:1px solid var(--line)}
  html[data-theme="robot"] .section-title::before{width:6px;height:18px;border-radius:2px;
    background:var(--primary);box-shadow:none}
  html[data-theme="robot"] .tag,html[data-theme="robot"] .c-tag{border-radius:6px}
  html[data-theme="robot"] .h-title{letter-spacing:-.01em}
  html[data-theme="robot"] .summary,
  html[data-theme="robot"] .panel,
  html[data-theme="robot"] .card,
  html[data-theme="robot"] .col,
  html[data-theme="robot"] .tl-card,
  html[data-theme="robot"] .cost-card,
  html[data-theme="robot"] .mrow{border-radius:var(--r-sm)}
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.65;min-height:100vh;position:relative;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
  .bg-deco{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(620px 420px at 12% -8%, rgba(var(--primary-rgb),.16), transparent 60%),
      radial-gradient(560px 400px at 100% 0%, rgba(var(--secondary-rgb),.14), transparent 55%),
      radial-gradient(700px 500px at 80% 110%, rgba(var(--bad-rgb),.08), transparent 60%);}
  /* 细网格质感：仅在顶部淡出，增加层次而不抢戏 */
  .bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55;
    background-image:linear-gradient(rgba(var(--primary-rgb),.045) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--primary-rgb),.045) 1px,transparent 1px);
    background-size:34px 34px;
    -webkit-mask-image:radial-gradient(120% 80% at 50% 0%,#000,transparent 75%);
    mask-image:radial-gradient(120% 80% at 50% 0%,#000,transparent 75%);}
  .wrap{position:relative;z-index:1;max-width:940px;margin:0 auto;padding:40px 22px 80px}

  .reveal{opacity:0;transform:translateY(16px);animation:rise .6s cubic-bezier(.2,0,0,1) forwards}
  @keyframes rise{to{opacity:1;transform:none}}

  /* Hero */
  .hero{margin-bottom:26px}
  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .tag{font-size:12.5px;font-weight:600;color:var(--primary);
    background:linear-gradient(135deg,rgba(var(--primary-rgb),.12),rgba(var(--secondary-rgb),.12));
    border:1px solid rgba(var(--primary-rgb),.18);padding:5px 12px;border-radius:999px}
  .h-title{font-size:clamp(28px,4.4vw,42px);font-weight:800;letter-spacing:-.02em;line-height:1.18}
  .h-meta{margin-top:12px;color:var(--ink-2);font-size:14px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .h-meta .dot{width:4px;height:4px;border-radius:50%;background:var(--line)}
  .summary{margin-top:18px;font-size:17px;color:var(--ink);background:var(--surface);
    border:1px solid var(--line);border-radius:var(--r-sm);padding:18px 20px;box-shadow:var(--shadow)}

  /* 构思原话（新增） */
  .origin{position:relative;margin-top:18px;padding:18px 20px 18px 60px;border-radius:var(--r-sm);
    background:linear-gradient(135deg,rgba(var(--primary-rgb),.085),rgba(var(--secondary-rgb),.05));
    border:1px solid rgba(var(--primary-rgb),.20);border-left:4px solid var(--primary);box-shadow:var(--shadow)}
  .origin::before{content:"\201D";position:absolute;left:18px;top:0;font-family:Georgia,"Times New Roman",serif;
    font-size:56px;line-height:1;color:var(--primary);opacity:.30}
  .origin .o-label{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;
    letter-spacing:.06em;color:var(--primary);text-transform:uppercase;margin-bottom:8px}
  .origin .o-label::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 3px rgba(var(--primary-rgb),.15)}
  .origin p{font-size:15.5px;color:var(--ink);line-height:1.75;white-space:pre-wrap;font-weight:500}

  /* 综合评分卡 */
  .scorecard{display:flex;align-items:center;gap:22px;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--r);padding:22px 26px;margin:22px 0;box-shadow:var(--shadow);
    position:relative;overflow:hidden}
  .scorecard::after{content:"";position:absolute;inset:0;border-radius:var(--r);pointer-events:none;
    background:linear-gradient(120deg,transparent 40%,rgba(var(--primary-rgb),.05));}
  .score-num{font-size:54px;font-weight:800;letter-spacing:-.03em;line-height:1;
    background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;background-clip:text;color:transparent}
  .score-side .grade{display:inline-block;font-size:13px;font-weight:700;color:#fff;
    background:linear-gradient(135deg,var(--primary),var(--primary-2));padding:3px 10px;border-radius:999px;margin-bottom:6px}
  .score-side .sub{color:var(--ink-2);font-size:13.5px}
  .score-bar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:10px}
  .score-bar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--primary),var(--secondary));transition:width .8s cubic-bezier(.2,0,0,1)}
  /* 未评分（轻量记录）：中性灰 + 虚线边框，明确区别于「低分」 */
  .scorecard.none{background:var(--surface-2);border-style:dashed}
  .scorecard.none::after{display:none}
  .score-num.none{font-size:30px;letter-spacing:.02em;font-weight:800;color:var(--ink-2);
    background:none;-webkit-background-clip:initial;background-clip:initial}
  .score-side .grade.none{background:linear-gradient(135deg,var(--muted-a),var(--muted-b))}

  /* 网格 */
  .grid{display:grid;grid-template-columns:340px 1fr;gap:22px;margin:8px 0 30px}
  @media(max-width:720px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;
    box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.6)}
  .panel h3{font-size:14px;font-weight:700;color:var(--ink-2);letter-spacing:.04em;text-transform:uppercase;margin-bottom:14px}
  .radar-wrap{display:flex;justify-content:center}
  .radar{width:100%;max-width:360px;height:auto}
  .radar text{font-size:11px;font-weight:600;fill:var(--ink)}
  .radar .axis{stroke:var(--line);stroke-width:1}
  .radar .grid-c{fill:none;stroke:var(--line);stroke-width:1}
  .radar .data{fill:rgba(var(--primary-rgb),.16);stroke:var(--primary);stroke-width:2.5;stroke-linejoin:round}

  .bars{display:flex;flex-direction:column;gap:14px}
  .bar-row{display:grid;grid-template-columns:96px 1fr 38px;align-items:center;gap:12px}
  .bar-row .name{font-size:14px;font-weight:600}
  .bar-track{height:9px;border-radius:999px;background:var(--surface-2);overflow:hidden}
  .bar-track > i{display:block;height:100%;border-radius:999px;transition:width .8s cubic-bezier(.2,0,0,1)}
  .bar-row .val{font-size:14px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}

  /* 区块标题 */
  .section-title{font-size:20px;font-weight:800;letter-spacing:-.01em;margin:38px 0 16px;display:flex;align-items:center;gap:10px}
  .section-title::before{content:"";width:5px;height:20px;border-radius:999px;background:linear-gradient(180deg,var(--primary),var(--secondary))}

  /* 多维评价卡（维度数由数据决定：8 / 9 / 10） */
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:720px){.cards{grid-template-columns:1fr}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:18px 20px;
    box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .2s ease,box-shadow .2s ease}
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
  .card h4{font-size:15.5px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .card h4 .pill{font-size:11px;font-weight:800;color:#fff;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--primary),var(--primary-2));box-shadow:0 2px 6px rgba(var(--primary-rgb),.3)}
  .card p{font-size:14.5px;color:var(--ink-2);white-space:pre-wrap}
  .card p + p{margin-top:10px}

  /* 好处 / 坏处 */
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:720px){.duo{grid-template-columns:1fr}}
  .col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:18px 20px;
    box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.6)}
  .col h4{font-size:15.5px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .col.good h4{color:var(--good)} .col.bad h4{color:var(--bad)}
  .ul{list-style:none;display:flex;flex-direction:column;gap:11px}
  .ul li{position:relative;padding-left:26px;font-size:14.5px;color:var(--ink-2)}
  .ul li::before{position:absolute;left:0;top:1px;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;
    font-size:11px;font-weight:800;color:#fff}
  .col.good .ul li::before{content:"✓";background:var(--good)}
  .col.bad .ul li::before{content:"!";background:var(--bad)}

  /* 问题与应对 */
  .risks{display:flex;flex-direction:column;gap:12px}
  .risk{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--warn);
    border-radius:var(--r-sm);padding:16px 18px;box-shadow:var(--shadow)}
  .risk .q{font-size:15px;font-weight:700;display:flex;gap:9px;align-items:flex-start}
  .risk .q .ic{flex:none;color:var(--warn);font-weight:900}
  .risk .a{margin-top:9px;font-size:14.5px;color:var(--ink-2);padding-left:26px}
  .risk .a b{color:var(--primary);font-weight:700}

  /* 路线图 */
  .tl{position:relative;padding-left:30px}
  .tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;
    background:linear-gradient(180deg,var(--primary),var(--secondary))}
  .tl-item{position:relative;margin-bottom:18px}
  .tl-item:last-child{margin-bottom:0}
  .tl-item::before{content:"";position:absolute;left:-30px;top:4px;width:16px;height:16px;border-radius:50%;
    background:var(--surface);border:3px solid var(--primary);box-shadow:0 0 0 4px rgba(var(--primary-rgb),.10)}
  .tl-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:16px 18px;
    box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.6)}
  .tl-card .ph{display:inline-block;font-size:12px;font-weight:800;color:#fff;padding:3px 11px;border-radius:999px;margin-bottom:8px;
    background:linear-gradient(135deg,var(--primary),var(--primary-2))}
  .tl-card .goal{font-size:15px;font-weight:700;margin-bottom:8px}
  .tl-card .steps{list-style:none;display:flex;flex-direction:column;gap:7px}
  .tl-card .steps li{position:relative;padding-left:20px;font-size:14.5px;color:var(--ink-2)}
  .tl-card .steps li::before{content:"";position:absolute;left:4px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--primary-2)}
  .tl-card .done{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13.5px;color:var(--good);font-weight:600}

  /* 要避免的坑 */
  .avoid{background:linear-gradient(180deg,rgba(var(--bad-rgb),.05),rgba(var(--bad-rgb),.02));
    border:1px solid rgba(var(--bad-rgb),.22);border-radius:var(--r-sm);padding:20px 22px}
  .avoid .ul li::before{content:"✕";background:var(--bad)}

  /* 成功/失败判据 */
  .metrics{display:flex;flex-direction:column;gap:10px}
  .mrow{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 18px;box-shadow:var(--shadow);align-items:center}
  .mrow .m-name{font-size:14.5px;font-weight:700}
  .mrow .m-ok,.mrow .m-no{font-size:13.5px;display:flex;gap:7px;align-items:flex-start}
  .mrow .m-ok{color:var(--good)} .mrow .m-no{color:var(--bad)}
  .mrow .m-ok b,.mrow .m-no b{flex:none;font-weight:900}
  @media(max-width:720px){.mrow{grid-template-columns:1fr;gap:6px}}

  /* 成本投入 */
  .cost{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:720px){.cost{grid-template-columns:1fr}}
  .cost-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:18px;
    box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.6);text-align:center}
  .cost-card .cv{font-size:22px;font-weight:800;letter-spacing:-.02em;
    background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;background-clip:text;color:transparent}
  .cost-card .cl{font-size:12.5px;font-weight:700;color:var(--ink-2);margin-top:4px;letter-spacing:.04em}
  .cost-card .cn{font-size:12.5px;color:var(--ink-2);margin-top:7px;opacity:.85}
  .cost-other{margin-top:12px;font-size:14px;color:var(--ink-2);background:var(--surface-2);border-radius:var(--r-sm);padding:13px 16px}
  .cost-other b{color:var(--ink)}

  /* 实现可行性评估（第 9 维的支撑性结构化拆解） */
  .feas-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:720px){.feas-grid{grid-template-columns:1fr}}
  .feas .col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:18px 20px;
    box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.6)}
  .feas .col h4{font-size:15.5px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .feas .col h4::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--primary);box-shadow:0 0 0 3px rgba(var(--primary-rgb),.14)}
  .feas .col:last-child h4::before{background:var(--secondary);box-shadow:0 0 0 3px rgba(var(--secondary-rgb),.16)}
  .feas-empty{font-size:14px;color:var(--ink-2);opacity:.7}
  .feas-verdict,.feas-cost{margin-top:14px;font-size:14.5px;color:var(--ink-2);background:var(--surface);
    border:1px solid var(--line);border-left:4px solid var(--primary);border-radius:var(--r-sm);padding:14px 18px;line-height:1.7}
  .feas-verdict b,.feas-cost b{color:var(--ink);font-weight:700}
  .feas-empty-note{font-size:14px;color:var(--ink-2);background:var(--surface-2);border:1px dashed var(--line);
    border-radius:var(--r-sm);padding:16px 18px;line-height:1.7}

  /* 参考提示词（想更好地落地这个 idea，可直接复制的优化提示词） */
  .prompts{display:flex;flex-direction:column;gap:14px}
  .prompt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);
    box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.6);overflow:hidden}
  .prompt .p-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 16px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(135deg,rgba(var(--primary-rgb),.07),rgba(var(--secondary-rgb),.04))}
  .prompt .p-label{font-size:13px;font-weight:800;color:var(--primary);display:inline-flex;align-items:center;gap:8px}
  .prompt .p-label::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 3px rgba(var(--primary-rgb),.15)}
  .prompt .p-copy{flex:none;font-family:inherit;font-size:12px;font-weight:700;color:var(--primary);cursor:pointer;
    background:rgba(var(--primary-rgb),.10);border:1px solid rgba(var(--primary-rgb),.22);padding:5px 12px;border-radius:999px;
    transition:background .18s ease,transform .12s ease,color .18s ease}
  .prompt .p-copy:hover{background:rgba(var(--primary-rgb),.18)}
  .prompt .p-copy:active{transform:scale(.95)}
  .prompt .p-copy.ok{color:#fff;background:var(--primary);border-color:var(--primary)}
  .prompt .p-text{padding:14px 16px;font-size:14px;color:var(--ink-2);line-height:1.75;white-space:pre-wrap;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace}
  .prompts-note{margin-top:12px;font-size:13px;color:var(--ink-2);opacity:.82;line-height:1.6}
  html[data-theme="robot"] .prompt .p-copy{border-radius:6px}

  .alert{background:rgba(var(--bad-rgb),.10);border:1px solid rgba(var(--bad-rgb),.35);border-left:5px solid var(--bad);
    color:var(--bad-ink);border-radius:var(--r-sm);padding:14px 18px;font-size:14px;font-weight:600;line-height:1.6;margin-bottom:20px}
  .h-meta .meta-ico{display:inline-flex;align-items:center;gap:6px}
  .back{display:inline-flex;align-items:center;gap:7px;margin-top:40px;font-weight:700;color:var(--primary);text-decoration:none;font-size:15px;
    background:var(--surface);border:1px solid var(--line);padding:11px 18px;border-radius:999px;box-shadow:var(--shadow);

<script>
// 页面标题随 IDEA.title 自动同步——单一数据源，避免生成时漏替换占位符
document.addEventListener('DOMContentLoaded', function () {
  try { document.title = IDEA.title + ' · 灵感详情'; } catch (e) { /* IDEA 缺失时保留兜底标题 */ }
});
/* ============================================================
   灵感详情数据对象 —— 复制模板后，只改这个对象里的字段即可。
   评分维度 8 / 9 / 10 个：完整体检默认 10 个（原八维 + 第 9 维「实现可行性」+ 第 10 维「目标用户」）；
   历史条目 8 或 9 个也正常（功能逐步上线），页面会自动识别、不会报「维度数异常」。scores 为 1-10 整数。
   轻量记录（用户明确说「不要打分」）时 scores 留空 {}，页面会自动隐藏雷达图与评分卡、
   改为「未评分」说明条——不要把「没打分」写成 0 分。
   字段说明：
     title    灵感标题
     ts       灵感时间
     tags     标签数组
     summary  一句话结论
     origin   构思原话（用户抛出的原话，可选；留空则详情页不显示「你的构思原话」区块）
     scores   评分 {维度:1-10}；完整体检含 10 个维度：解决的问题 / 目标用户 / 实用性 / 市场价值 / 竞品分析 / 变现可能 / 技术方案 / 可扩展性 / 实现计划 / 实现可行性
     details  各维度评价正文 {维度:"多段文本，空行\\n\\n分隔"}；需与 scores 的维度一一对应
     pros/cons/risks/roadmap/avoid/metrics/cost 见下
     prompts  参考提示词数组 [{label:"用途", text:"可直接复制的优化提示词"}]（可选）；用于「想更好地落地这个 idea」时把提示词喂给 AI，留空则详情页不显示该区块
     feasibility 实现可行性专项评估（结构化）：tech 技术能力 / resources 配套资源 /
                verdict 可行性结论 / cost_basis 成本与代价依据（cost 字段里那些数字的来历）
   ============================================================ */
/* 色调：页面右上角可切「冷白机甲 ROBOT / 蓝紫极光 AURORA」，选择存 localStorage；
   默认色调由 upsert-idea.js 从 config.json 的 theme 注入到 window.__XIN_DEFAULT_THEME__。 */
const IDEA = {
  title: "（灵感标题）",
  ts: "2026-01-01 00:00",
  tags: ["分类标签", "示例"],
  summary: "一句话讲清这个灵感解决什么、为什么值得做。",
  origin: "（可选）用户抛出这个灵感时说的原话，例如「我有个想法，做一个可以把灵感记录成卡片墙的页面，同时给每个灵感打分」。留空则不显示。",
  scores: {
    "解决的问题": 7, "实用性": 7, "市场价值": 7, "竞品分析": 7,
    "变现可能": 7, "技术方案": 7, "可扩展性": 7, "实现计划": 7,
    "实现可行性": 7, "目标用户": 7
  },
  details: {
    "解决的问题": "描述它解决了什么、谁在痛。必须明确：这是用户真实存在、被广泛感知的痛点（痛到愿意付费/改变行为），还是我们想象出来的问题（自嗨、不存在或没人 Care）？只解决想象问题的灵感，这维不应给高分。",
    "实用性": "在日常/工作场景中可被使用的程度与频率。",
    "市场价值": "目标人群规模、付费意愿、市场阶段；并必须论述市场运营与推广的可行性——靠什么渠道触达用户、冷启动与获客难度多大、推广代价（是否需要销售体系/地推/买量、获客成本量级），是能自传播还是重度依赖资源铺设。只算『有市场』不算数，要算清『怎么卖出去』的成本与难度。",
    "竞品分析": "已有玩家、他们的短板、本想法的差异化与壁垒。",
    "变现可能": "可行的变现路径（订阅/一次性/渠道替卖等）与可行性。",
    "技术方案": "实现思路、关键技术选型、可行性评估。",
    "可扩展性": "未来可延展的方向、复用与组合空间。",
    "实现计划": "分阶段落地步骤（MVP→加载背书→放大）。",
    "实现可行性": "落地需要什么样的技术能力与配套资源：门槛高不高、合理代价内能否做出来。",
    "目标用户": "清晰定义谁会用、谁会付费：角色/场景/规模/付费能力与决策权。用户画像模糊、『所有人』式泛化、或目标用户根本不会为这东西买单——这维给低分。"
  },
  pros: ["收益点一（最好能算清账，如省下多少时间/多少钱）", "收益点二"],
  cons: ["代价一（时间/金钱/精力/机会成本）", "风险点二"],
  risks: [
    { q: "可能遇到的问题", a: "具体应对办法" }
  ],
  roadmap: [
    { phase: "第 0 步 · 验证", goal: "用最小代价判断值不值得做", steps: ["动作一", "动作二"], done: "达到什么状态算这一步完成" }
  ],
  avoid: ["最容易犯、且代价很高的错，一条条列清"],
  metrics: [
    { name: "核心指标", target: "达到即算成功的线", fail: "跌破即应止损的线" }
  ],
  cost: {
    effort: { v: "约 X 人日", n: "开发和调试的精力投入" },
    time:   { v: "X 周",     n: "从启动到可用/上线" },
    money:  { v: "≈ ¥X",     n: "服务器、API、工具等现金支出" },
    other:  "机会成本：这段时间挤占了哪些其他项目"
  },
  feasibility: {
    tech: ["实现所需技术能力 / 技能栈，逐条列（如：Python 后端、容器化、MiniPC 硬件选型、LIMS 集成、ACMG 变异分类）"],
    resources: ["配套资源：硬件库存、数据集（如 VKB 变异库）、资质证照（软著 / 医疗器械备案）、渠道、人力预算"],
    verdict: "可行性结论：当前可直接做 / 需先补齐某项资源 / 暂不具备条件",
    cost_basis: "成本与代价依据：把上面的「能力 + 资源」折算成费用 / 人日 / 周期的逻辑——这是 cost 字段里精力 / 时间 / 金钱数字的来历"
  },
  prompts: [
    { label: "用途一句话（如：深挖选题）", text: "可直接复制使用的完整提示词，把括号里的占位换成你的真实情况" }
  ]
};

/* ===================== 渲染逻辑（一般无需改动） ===================== */
/* 缺字段兜底：字段缺失时不让整页崩掉，也不让页面冒出 "undefined" */
const DEFAULT_FIELDS = {
  title:"（未命名灵感）", ts:"", tags:[], summary:"", origin:"",
  scores:{}, details:{}, pros:[], cons:[], risks:[], roadmap:[], avoid:[], metrics:[], cost:{}, prompts:[]
};
Object.keys(DEFAULT_FIELDS).forEach(k=>{ if(IDEA[k]===undefined||IDEA[k]===null) IDEA[k]=DEFAULT_FIELDS[k]; });

const EXPECT_DIMS = [8, 9, 10];                             // 完整体检默认 10 维（原八维 + 实现可行性 + 目标用户）；历史条目 8/9 维也正常
const DIMS = Object.keys(IDEA.scores);
const UNSCORED = DIMS.length === 0;                     // 未评分：轻量记录（用户明确说「不要打分」时）
const DIMS_ALERT = !UNSCORED && !EXPECT_DIMS.includes(DIMS.length);   // 只有「填了却维度数异常（非 8/9/10）」才报红；未评分不是异常
const MAX = 10;
const mean = DIMS.length ? DIMS.reduce((s,k)=>s+IDEA.scores[k],0)/DIMS.length : 0;
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function grade(m){ if(m>=8.5)return"S"; if(m>=7.5)return"A"; if(m>=6.5)return"B"; if(m>=5.5)return"C"; return"D"; }
function barColor(v){
  // 色阶走 CSS 变量，随主题（AURORA 彩色 / ROBOT 钢灰）自动切换
  if(v>=8) return "linear-gradient(90deg,var(--bar1a),var(--bar1b))";
  if(v>=6) return "linear-gradient(90deg,var(--bar2a),var(--bar2b))";
  if(v>=4) return "linear-gradient(90deg,var(--bar3a),var(--bar3b))";
  return "linear-gradient(90deg,var(--bar4a),var(--bar4b))";
}
function radarSVG(){
  if(!DIMS.length) return '';                           // 未评分：不画雷达图
  const cx=180,cy=180,R=120,n=DIMS.length,step=Math.PI*2/n; let g='';
  [2,4,6,8,10].forEach(ring=>{
    const r=R*ring/MAX; let pts=[];
    for(let i=0;i<n;i++){const a=-Math.PI/2+i*step;pts.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1));}
    g+=`<polygon class="grid-c" points="${pts.join(' ')}"/>`;
  });
  DIMS.forEach((d,i)=>{
    const a=-Math.PI/2+i*step, x=cx+R*Math.cos(a), y=cy+R*Math.sin(a);
    g+=`<line class="axis" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`;
    const lx=cx+(R+22)*Math.cos(a), ly=cy+(R+22)*Math.sin(a);
    let anchor="middle"; if(Math.cos(a)>0.3)anchor="start"; else if(Math.cos(a)<-0.3)anchor="end";
    g+=`<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}">${esc(d)}</text>`;
  });
  let dp=[];
  DIMS.forEach((d,i)=>{const a=-Math.PI/2+i*step, rr=R*IDEA.scores[d]/MAX;
    dp.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1));});
  g+=`<polygon class="data" points="${dp.join(' ')}"/>`;
  return `<svg class="radar" viewBox="0 0 360 360" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
}
const barsHTML = () => DIMS.map(d=>{const v=IDEA.scores[d];
  return `<div class="bar-row"><span class="name">${esc(d)}</span>
    <span class="bar-track"><i style="width:0%;background:${barColor(v)}" data-w="${(v/MAX*100).toFixed(0)}%"></i></span>
    <span class="val">${v}</span></div>`;}).join('');
const cardsHTML = () => DIMS.map((d,i)=>{
  const paras=String(IDEA.details[d]||"").split(/\n\n+/).map(p=>`<p>${esc(p.trim())}</p>`).join('');
  return `<div class="card"><h4><span class="pill">${i+1}</span>${esc(d)}</h4>${paras}</div>`;}).join('');

const sec = (title, inner) => (inner && inner.trim()) ? `<div class="section-title reveal">${esc(title)}</div>${inner}` : '';
const ulHTML = arr => (arr&&arr.length) ? `<ul class="ul">${arr.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>` : '';
const originHTML = () => (IDEA.origin && IDEA.origin.trim()) ? `
  <div class="origin reveal">
    <div class="o-label">你的构思原话</div>
    <p>${esc(IDEA.origin)}</p>
  </div>` : '';

/* 实现可行性评估：第 9 维「实现可行性」的支撑性结构化拆解（第 10 维「目标用户」属评分维度，无独立结构化字段）。
   既有「能力 + 资源」的客观清单，又有「可行性结论 + 成本依据」——后者直接支撑 cost 字段。 */
function feasibilityHTML() {
  if (UNSCORED) return '';                            // 轻量记录不做可行性评估
  const f = IDEA.feasibility;
  const has = f && (f.tech || f.resources || f.verdict || f.cost_basis);
  if (!has) {
    return `<div class="section-title reveal">实现可行性评估</div>
    <div class="feas-empty-note reveal">本条录入时未做「可行性专项评估」（功能上线前的历史条目）。新建灵感会自动包含该维度与结构化评估。</div>`;
  }
  const tech = (f.tech && f.tech.length) ? ulHTML(f.tech) : '<p class="feas-empty">未列明</p>';
  const res = (f.resources && f.resources.length) ? ulHTML(f.resources) : '<p class="feas-empty">未列明</p>';
  return `
    <div class="section-title reveal">实现可行性评估</div>
    <div class="feas">
      <div class="feas-grid">
        <div class="col"><h4>所需技术能力</h4>${tech}</div>
        <div class="col"><h4>配套资源</h4>${res}</div>
      </div>
      ${f.verdict ? `<div class="feas-verdict reveal"><b>可行性结论：</b>${esc(f.verdict)}</div>` : ''}
      ${f.cost_basis ? `<div class="feas-cost reveal"><b>成本与代价依据：</b>${esc(f.cost_basis)}</div>` : ''}
    </div>`;
}

/* 参考提示词：想把这个 idea 更好地落地时，可直接复制给 AI 用的优化提示词。
   数据缺失（历史条目）时整块隐藏，不显示空壳。 */
function promptsHTML() {
  const arr = IDEA.prompts;
  if (!(arr && arr.length)) return '';
  const items = arr.map(p => `
    <div class="prompt">
      <div class="p-head"><span class="p-label">${esc(p.label)}</span>
        <button class="p-copy" type="button" aria-label="复制这条提示词">复制</button></div>
      <div class="p-text">${esc(p.text)}</div>
    </div>`).join('');
  return `
    <div class="section-title reveal">参考提示词</div>
    <div class="prompts reveal">${items}</div>
    <div class="prompts-note reveal">想让这条灵感更好地落地，可直接点「复制」把提示词丢给 AI；括号里的占位换成你的真实情况即可。</div>`;
}

function render(){
  const dua = (IDEA.pros&&IDEA.pros.length)||(IDEA.cons&&IDEA.cons.length) ? `
    <div class="duo reveal">
      <div class="col good"><h4>好处（值不值得做的理由）</h4>${ulHTML(IDEA.pros)}</div>
      <div class="col bad"><h4>坏处与代价</h4>${ulHTML(IDEA.cons)}</div>
    </div>` : '';

  const risksH = (IDEA.risks&&IDEA.risks.length) ? `<div class="risks reveal">${IDEA.risks.map(r=>`
    <div class="risk"><div class="q"><span class="ic">?</span><span>${esc(r.q)}</span></div>
    <div class="a"><b>应对：</b>${esc(r.a)}</div></div>`).join('')}</div>` : '';

  const roadH = (IDEA.roadmap&&IDEA.roadmap.length) ? `<div class="tl reveal">${IDEA.roadmap.map(m=>`
    <div class="tl-item"><div class="tl-card"><span class="ph">${esc(m.phase)}</span>
      <div class="goal">${esc(m.goal)}</div>
      <ul class="steps">${(m.steps||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
      ${m.done?`<div class="done">✔ 完成标志：${esc(m.done)}</div>`:''}
    </div></div>`).join('')}</div>` : '';

  const avoidH = (IDEA.avoid&&IDEA.avoid.length) ? `<div class="avoid reveal">${ulHTML(IDEA.avoid)}</div>` : '';

  const metH = (IDEA.metrics&&IDEA.metrics.length) ? `<div class="metrics reveal">${IDEA.metrics.map(m=>`
    <div class="mrow"><span class="m-name">${esc(m.name)}</span>
      <span class="m-ok"><b>✔</b><span>成功线：${esc(m.target)}</span></span>
      <span class="m-no"><b>✕</b><span>止损线：${esc(m.fail)}</span></span></div>`).join('')}</div>` : '';

  const c = IDEA.cost||{};
  const costH = (c.effort||c.time||c.money) ? `
    <div class="cost reveal">
      ${c.effort?`<div class="cost-card"><div class="cv">${esc(c.effort.v)}</div><div class="cl">精力</div><div class="cn">${esc(c.effort.n||'')}</div></div>`:''}
      ${c.time?`<div class="cost-card"><div class="cv">${esc(c.time.v)}</div><div class="cl">时间</div><div class="cn">${esc(c.time.n||'')}</div></div>`:''}
      ${c.money?`<div class="cost-card"><div class="cv">${esc(c.money.v)}</div><div class="cl">金钱</div><div class="cn">${esc(c.money.n||'')}</div></div>`:''}
    </div>${c.other?`<div class="cost-other reveal"><b>其它代价：</b>${esc(c.other)}</div>`:''}` : '';

  document.getElementById('app').innerHTML = `
    ${DIMS_ALERT?`<div class="alert reveal">维度数异常：期望 ${EXPECT_DIMS} 个，实际 ${DIMS.length} 个${DIMS.length?`（${DIMS.map(esc).join('、')}）`:''}。综合评分按现有维度求均值，结果不可信——请检查 scores 是否漏填或键名写错。</div>`:''}
    <header class="hero reveal">
      <div class="tags">${IDEA.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
      <h1 class="h-title">${esc(IDEA.title)}</h1>
      <div class="h-meta"><span class="meta-ico"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg>${esc(IDEA.ts)}</span><span class="dot"></span><span>${UNSCORED ? '未评分' : `综合评分 ${mean.toFixed(1)} / 10`}</span></div>
      <div class="summary">${esc(IDEA.summary)}</div>
      ${originHTML()}
    </header>
    ${UNSCORED ? `
    <div class="scorecard none reveal" style="animation-delay:.05s">
      <div class="score-num none">未评</div>
      <div class="score-side">
        <span class="grade none">未做体检</span>
        <div class="sub">本条为轻量记录，未做维度体检。需要时补一次评估就能出完整评分。</div>
      </div>
    </div>` : `
    <div class="scorecard reveal" style="animation-delay:.05s">
      <div class="score-num">${mean.toFixed(1)}</div>
      <div class="score-side">
        <span class="grade">${grade(mean)} 级</span>
        <div class="sub">综合评分 · 满分 10 · 基于 ${DIMS.length} 个维度均值</div>
        <div class="score-bar"><i style="width:0%" data-w="${(mean/MAX*100).toFixed(0)}%"></i></div>
      </div>
    </div>`}
    ${UNSCORED ? '' : `
    <div class="grid">
      <div class="panel reveal" style="animation-delay:.1s"><h3>维度雷达</h3><div class="radar-wrap">${radarSVG()}</div></div>
      <div class="panel reveal" style="animation-delay:.15s"><h3>分项评分</h3><div class="bars">${barsHTML()}</div></div>
    </div>`}
    ${sec(DIMS.length + " 维深度评价", `<div class="cards reveal" style="animation-delay:.05s">${cardsHTML()}</div>`)}
    ${sec("收益 vs 代价", dua)}
    ${sec("可能遇到的问题与应对", risksH)}
    ${sec("落地路线图", roadH)}
    ${sec("要避免的坑", avoidH)}
    ${sec("成功 / 失败判据（随时可评判）", metH)}
    ${feasibilityHTML()}
    ${sec("成本投入", costH)}
    ${promptsHTML()}
    <div class="foot-nav">
      <a class="back" href="../index.html">← 返回灵感库</a>
      <button class="close-card" type="button" id="closeCard">✕ 关闭本页</button>
    </div>
    <div class="foot">由 xin-ideas skill 生成 · 灵感不做评判，只做体检</div>
  `;
  requestAnimationFrame(()=>{document.querySelectorAll('[data-w]').forEach(el=>{el.style.width=el.getAttribute('data-w');});});
}
render();

/* ============ 参考提示词：一键复制 ============ */
(function () {
  function fbCopy(text, done) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.top = '-9999px'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
    } catch (e) { /* 忽略：仍给「已复制」反馈，用户可手动选择复制 */ }
    done();
  }
  document.getElementById('app').addEventListener('click', function (e) {
    var btn = e.target.closest('.p-copy');
    if (!btn) return;
    var box = btn.closest('.prompt');
    var el = box ? box.querySelector('.p-text') : null;
    var txt = el ? el.textContent : '';
    var mark = function () {
      if (btn.dataset.ok) return; btn.dataset.ok = '1';
      var old = btn.textContent; btn.textContent = '已复制'; btn.classList.add('ok');
      setTimeout(function () { btn.textContent = old; btn.classList.remove('ok'); delete btn.dataset.ok; }, 1400);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(mark, function () { fbCopy(txt, mark); });
    } else { fbCopy(txt, mark); }
  });
})();

/* ============ 关闭本页：卡片是在新标签页打开的，一键关掉最顺手 ============
   浏览器只允许脚本关闭「由链接/脚本打开」的标签页；若不允许（例如手动输入地址打开），
   就退回灵感库列表页，保证按钮永远有反馈、不会点了没反应。 */
document.getElementById('app').addEventListener('click', function (e) {
  if (!e.target.closest('#closeCard')) return;
  try { window.close(); } catch (err) { /* 忽略：下面兜底跳转 */ }
  setTimeout(function () { location.replace('../index.html'); }, 220);
});

/* ============ 返回顶部浮动按钮：滚动超过一屏出现 · 可拖动 · 位置记忆 ============ */
(function () {
  var btn = document.getElementById('toTop');
  if (!btn) return;
  var KEY = 'xin-ideas-backtop-pos', M = 10;
  var dragging = false, moved = false, sx = 0, sy = 0, ox = 0, oy = 0;

  function size() { return [btn.offsetWidth || 48, btn.offsetHeight || 48]; }
  function clamp(x, y) {
    var wh = size();
    return [Math.min(Math.max(x, M), Math.max(M, window.innerWidth - wh[0] - M)),
            Math.min(Math.max(y, M), Math.max(M, window.innerHeight - wh[1] - M))];
  }
  function place(x, y) { var p = clamp(x, y); btn.style.left = p[0] + 'px'; btn.style.top = p[1] + 'px'; }

  function restore() {
    var s = null;
    try { s = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { /* 读不到就用默认位 */ }
    if (s && typeof s.x === 'number' && typeof s.y === 'number') place(s.x, s.y);
    else place(window.innerWidth - 66, window.innerHeight - 72);   // 默认右下角
  }
  restore();

  function onScroll() {
    var y = window.scrollY || document.documentElement.scrollTop || 0;
    btn.classList.toggle('show', y > 360);
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  function toTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

  btn.addEventListener('pointerdown', function (e) {
    dragging = true; moved = false; sx = e.clientX; sy = e.clientY;
    var r = btn.getBoundingClientRect(); ox = r.left; oy = r.top;
    btn.classList.add('dragging');
    if (btn.setPointerCapture) { try { btn.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ } }
    e.preventDefault();
  });
  btn.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;   // 位移阈值：区分「点」和「拖」
    if (moved) place(ox + dx, oy + dy);
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    btn.classList.remove('dragging');
    if (moved) {
      var r = btn.getBoundingClientRect();                    // 拖完记住位置，下次还用这儿
      try { localStorage.setItem(KEY, JSON.stringify({ x: r.left, y: r.top })); } catch (e) { /* 忽略 */ }
    } else {
      toTop();                                               // 没拖动 = 点击 → 回顶部
    }
  }
  btn.addEventListener('pointerup', endDrag);
  btn.addEventListener('pointercancel', endDrag);
  btn.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toTop(); }
  });
  window.addEventListener('resize', function () { var r = btn.getBoundingClientRect(); place(r.left, r.top); });
  window.addEventListener('orientationchange', function () { var r = btn.getBoundingClientRect(); place(r.left, r.top); });
})();

/* ============ 色调切换：AURORA 蓝紫极光 / ROBOT 冷白机甲 ============
   选择存 localStorage，明细页与列表页共用；首屏由 <head> 里的内联脚本先应用，
   这里只负责渲染选择器与响应点击（避免主题闪一下）。 */
(function () {
  var KEY = 'xin-ideas-theme';
  var THEMES = [
    { id: 'robot',  name: '冷白机甲', en: 'ROBOT',  sw: ['#14171E', '#7A8598', '#FFFFFF'] },
    { id: 'aurora', name: '蓝紫极光', en: 'AURORA', sw: ['#6C63FF', '#3ECFCF', '#FF6584'] }
  ];
  var root = document.documentElement;
  var pick = document.getElementById('themePick');
  if (!pick) return;
  var btn = document.getElementById('themeBtn');
  var menu = document.getElementById('themeMenu');
  var swBox = document.getElementById('themeBtnSw');
  var nameBox = document.getElementById('themeBtnName');

  function findBy(id) {
    for (var i = 0; i < THEMES.length; i++) if (THEMES[i].id === id) return THEMES[i];
    return THEMES[0];
  }
  function current() {
    var t = root.getAttribute('data-theme') || window.__XIN_DEFAULT_THEME__ || 'aurora';
    return findBy(t).id;
  }
  function swatches(t, cls) {
    return '<span class="' + cls + '">' + t.sw.map(function (c) {
      return '<i style="background:' + c + '"></i>';
    }).join('') + '</span>';
  }
  function paint() {
    var cur = current();
    var t = findBy(cur);
    swBox.innerHTML = t.sw.map(function (c) {
      return '<i style="background:' + c + '"></i>';
    }).join('');
    nameBox.textContent = t.name;
    var opts = THEMES.map(function (x) {
      return '<button class="theme-opt' + (x.id === cur ? ' on' : '') + '" role="option" data-theme="' + x.id +
        '" aria-selected="' + (x.id === cur) + '" type="button">' + swatches(x, 'sw') +
        '<span class="meta"><span class="nm">' + x.name + '</span><span class="en">' + x.en + '</span></span>' +
        '<span class="ck" aria-hidden="true">✓</span></button>';
    }).join('');
    menu.innerHTML = opts;
  }
  function apply(id) {
    root.setAttribute('data-theme', id);
    try { localStorage.setItem(KEY, id); } catch (e) { /* 隐私模式忽略 */ }
    paint();
  }
  function close() { pick.classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); }
  function open() { pick.classList.add('open'); btn.setAttribute('aria-expanded', 'true'); }

  btn.addEventListener('click', function (e) {
    e.preventDefault(); e.stopPropagation();
    if (pick.classList.contains('open')) close(); else open();
  });
  menu.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.theme-opt') : null;
    if (!b) return;
    e.preventDefault(); e.stopPropagation();
    apply(b.getAttribute('data-theme'));
    close();
  });
  document.addEventListener('click', function (e) {
    if (pick.classList.contains('open') && !pick.contains(e.target)) close();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') close();
  });
  paint();

  /* 同一后台标签页之间也同步（切页回来不会残留旧主题） */
  window.addEventListener('storage', function (e) {
    if (e.key === KEY && e.newValue) apply(e.newValue);
  });
})();

</script>
